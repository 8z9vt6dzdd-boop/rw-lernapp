name: Abgleich-Dienst

# Veröffentlicht den Cloudflare Worker (sync-worker/) samt D1-Datenbank oder liest gemeldete Inhalte aus.
# Benötigt die Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      aktion:
        description: 'veroeffentlichen oder meldungen'
        required: true
        default: veroeffentlichen
        type: choice
        options: [veroeffentlichen, meldungen]
  push:
    branches: [main]
    paths: ['sync-worker/**']

permissions:
  contents: read

concurrency:
  group: abgleich
  cancel-in-progress: false

jobs:
  abgleich:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      AKTION: ${{ github.event.inputs.aktion || 'veroeffentlichen' }}
    steps:
      - uses: actions/checkout@v4
      - name: Zugang vorhanden?
        id: zugang
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare-Zugang noch nicht hinterlegt – übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.zugang.outputs.ok == 'true'
        with:
          node-version: 24
      - run: npm ci --prefix sync-worker
        if: steps.zugang.outputs.ok == 'true'
      - name: Zugang prüfen (Konto und Berechtigungen)
        if: steps.zugang.outputs.ok == 'true'
        working-directory: sync-worker
        run: |
          npx wrangler whoami || true
          echo "Länge der Konto-ID: ${#CLOUDFLARE_ACCOUNT_ID} (erwartet 32)"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log('Token gültig:', r.success, r.result && r.result.status)"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));const ids=(r.result||[]).map(a=>a.id);console.log('Konten mit Zugriff:', ids.length, 'Konto-ID passt:', ids.includes(process.env.CLOUDFLARE_ACCOUNT_ID))"
      - name: Datenbank anlegen bzw. finden
        if: steps.zugang.outputs.ok == 'true'
        working-directory: sync-worker
        run: |
          id=$(npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='rw-lernapp-sync');process.stdout.write(d?d.uuid:'')")
          if [ -z "$id" ]; then
            npx wrangler d1 create rw-lernapp-sync
            id=$(npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));process.stdout.write(l.find(x=>x.name==='rw-lernapp-sync').uuid)")
          fi
          echo "Datenbank-ID: $id"
          sed -i "s/database_id = \".*\"/database_id = \"$id\"/" wrangler.toml
      - name: Tabellen anlegen (idempotent)
        if: steps.zugang.outputs.ok == 'true' && env.AKTION == 'veroeffentlichen'
        working-directory: sync-worker
        run: npx wrangler d1 execute rw-lernapp-sync --remote --file=schema.sql --yes
      - name: Dienst veröffentlichen
        if: steps.zugang.outputs.ok == 'true' && env.AKTION == 'veroeffentlichen'
        working-directory: sync-worker
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Adresse: $url"
          echo "### Abgleich-Dienst: $url" >> "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://8z9vt6dzdd-boop.github.io' "$url/pull?code=x")
          echo "Probeaufruf: HTTP $code (400 erwartet)"
          test "$code" = "400"
      - name: Gemeldete Inhalte ausgeben
        if: steps.zugang.outputs.ok == 'true' && env.AKTION == 'meldungen'
        run: node scripts/meldungen.ts | tee -a "$GITHUB_STEP_SUMMARY"
